name: Check template i18n
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - ".github/workflows/check-template-i18n.yml"
      - "src/static/templates/**/*.hbs"
      - "src/static/locales/**/*.json"
      - "tools/check_template_i18n_keys.py"
  pull_request:
    paths:
      - ".github/workflows/check-template-i18n.yml"
      - "src/static/templates/**/*.hbs"
      - "src/static/locales/**/*.json"
      - "tools/check_template_i18n_keys.py"

defaults:
  run:
    shell: bash

jobs:
  template-i18n:
    name: Validate template i18n key coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run template i18n key coverage check
        run: python3 tools/check_template_i18n_keys.py
